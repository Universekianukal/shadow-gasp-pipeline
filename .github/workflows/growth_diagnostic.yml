name: shadow_gasp growth diagnostic (one-off, manual only)

# Read-only Analytics probe: real channel handle, subscriber trend (28d),
# top videos by views + their traffic-source breakdown, and full-resolution
# audience-retention curves for the top 2 videos. Same audit already run for
# MindUnlocked. Delete this file once the answer has been read from the run
# log -- it's diagnostic only, not part of the daily pipeline.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Growth diagnostic
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.parse, urllib.request, urllib.error, datetime as dt

          def access_token():
              body = urllib.parse.urlencode({
                  "client_id": os.environ["YOUTUBE_CLIENT_ID"],
                  "client_secret": os.environ["YOUTUBE_CLIENT_SECRET"],
                  "refresh_token": os.environ["YOUTUBE_REFRESH_TOKEN"],
                  "grant_type": "refresh_token",
              }).encode()
              req = urllib.request.Request("https://oauth2.googleapis.com/token", data=body)
              with urllib.request.urlopen(req) as r:
                  d = json.loads(r.read())
              if "access_token" not in d:
                  raise SystemExit(f"token refresh failed: {d}")
              print("granted scopes:", d.get("scope", ""))
              return d["access_token"]

          def get(url, token):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read()), None
              except urllib.error.HTTPError as e:
                  return None, f"{e.code} {e.read().decode(errors='replace')[:300]}"

          def analytics(token, **params):
              qs = urllib.parse.urlencode(params)
              return get(f"https://youtubeanalytics.googleapis.com/v2/reports?{qs}", token)

          token = access_token()

          print("\n=== 1) CHANNEL HANDLE / TITLE ===")
          ch, err = get("https://www.googleapis.com/youtube/v3/channels?part=snippet,statistics&mine=true", token)
          if err:
              print("ERROR:", err)
          else:
              snip = ch["items"][0]["snippet"]
              stats = ch["items"][0]["statistics"]
              print("title:", snip.get("title"))
              print("customUrl:", snip.get("customUrl"))
              print("subscriberCount:", stats.get("subscriberCount"))
              print("viewCount total:", stats.get("viewCount"))

          end = dt.date.today()
          start28 = end - dt.timedelta(days=28)
          start90 = end - dt.timedelta(days=90)
          s28, s90, e = start28.isoformat(), start90.isoformat(), end.isoformat()

          print("\n=== 2) SUBSCRIBERS net (28d) ===")
          data, err = analytics(token, ids="channel==MINE", startDate=s28, endDate=e,
                                 metrics="subscribersGained,subscribersLost")
          print(err or data.get("rows"))

          print("\n=== 3) TOP VIDEOS BY VIEWS (90d) ===")
          data, err = analytics(token, ids="channel==MINE", startDate=s90, endDate=e,
                                 metrics="views,subscribersGained,averageViewPercentage",
                                 dimensions="video", sort="-views", maxResults=8)
          top = []
          if err:
              print("ERROR:", err)
          else:
              cols = [h["name"] for h in data.get("columnHeaders", [])]
              print("columns:", cols)
              for row in data.get("rows", []):
                  print(" ", dict(zip(cols, row)))
                  top.append(row[0])

          print("\n=== 4) TRAFFIC SOURCE per top video (90d) ===")
          for vid in top:
              data, err = analytics(token, ids="channel==MINE", startDate=s90, endDate=e,
                                     metrics="views,estimatedMinutesWatched",
                                     dimensions="insightTrafficSourceType",
                                     filters=f"video=={vid}", sort="-views")
              print(f"-- {vid} --")
              print(err or data.get("rows"))

          print("\n=== 5) RETENTION CURVE for top 2 videos (90d) ===")
          for vid in top[:2]:
              data, err = analytics(token, ids="channel==MINE", startDate=s90, endDate=e,
                                     metrics="audienceWatchRatio,relativeRetentionPerformance",
                                     dimensions="elapsedVideoTimeRatio", filters=f"video=={vid}")
              print(f"-- {vid} --")
              if err:
                  print("ERROR:", err)
              else:
                  rows = data.get("rows", [])
                  for row in rows[::5]:
                      print(" ", row)
          PYEOF
