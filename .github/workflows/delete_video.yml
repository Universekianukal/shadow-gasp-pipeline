name: shadow_gasp one-off delete video

# Temporary, single-use workflow: deletes one YouTube video by id using the
# repo's current YOUTUBE_REFRESH_TOKEN secret (the local refresh_token.txt
# copy was stale/rotated). Removed again right after use -- not meant to be
# a standing capability.

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video id to delete"
        required: true

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Python deps
        run: pip install --quiet google-api-python-client google-auth-oauthlib
      - name: Delete video
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_ID: ${{ github.event.inputs.video_id }}
        run: |
          python3 -c "
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          creds = Credentials(
              token=None,
              refresh_token=os.environ['YOUTUBE_REFRESH_TOKEN'],
              token_uri='https://oauth2.googleapis.com/token',
              client_id=os.environ['YOUTUBE_CLIENT_ID'],
              client_secret=os.environ['YOUTUBE_CLIENT_SECRET'],
              scopes=['https://www.googleapis.com/auth/youtube.upload'],
          )
          yt = build('youtube', 'v3', credentials=creds)
          vid = os.environ['VIDEO_ID']
          resp = yt.videos().list(part='snippet,status', id=vid).execute()
          items = resp.get('items', [])
          if not items:
              print(f'Video {vid} not found (already deleted or wrong id)')
          else:
              print('Found:', items[0]['snippet']['title'], items[0]['status']['privacyStatus'])
              yt.videos().delete(id=vid).execute()
              print(f'Deleted {vid}')
          "
