name: shadow_gasp secret check (one-off, diagnostic only)

# Prints a SHA-256 hash + length of BATCH_NOTIFY_SECRET as stored in this
# repo's Actions secrets, so it can be compared against the value that was
# set locally -- without ever printing the actual secret. Delete once no
# longer needed.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Hash the secret
        env:
          BATCH_NOTIFY_SECRET: ${{ secrets.BATCH_NOTIFY_SECRET }}
        run: |
          python3 -c "
          import hashlib, os
          v = os.environ.get('BATCH_NOTIFY_SECRET', '')
          print('gh secret sha256:', hashlib.sha256(v.encode()).hexdigest())
          print('gh secret len:', len(v))
          "
