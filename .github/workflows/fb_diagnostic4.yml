name: shadow_gasp fb diagnostic 4 (one-off, manual only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Raw video_insights response for one video
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          GRAPH="https://graph.facebook.com/v19.0"
          echo "=== raw response, day37 video ==="
          curl -sS "$GRAPH/1732192041382038/video_insights?metric=total_video_views,total_video_impressions&access_token=$FB_PAGE_ACCESS_TOKEN"
          echo ""
          echo ""
          echo "=== raw response, no metric filter (list all available) ==="
          curl -sS "$GRAPH/1732192041382038/video_insights?access_token=$FB_PAGE_ACCESS_TOKEN"
