name: shadow_gasp short (build + render + publish)

# Generates one new batch day the same way batch_pregen.yml does (case ->
# script + 16 shot prompts -> FLUX stills on Kaggle GPU), auto-numbered as
# the next day after the highest existing _pipeline/batch/dayNN/, commits it,
# then asks the Telegram bot to request a Google Flow hook video for it --
# same flow as manual /day <N>. This used to build+render+upload a full
# video in one shot with no hook clip at all (CogVideoX was removed
# 2026-08-01 for GPU cost, leaving every daily video a flat Ken Burns
# still); now it never publishes without either a real hook video or an
# explicit timeout fallback (see the Worker's 5h cron sweep in worker.js).
#
# finish_batch_day.yml (same workflow the 30-day batch uses) does the actual
# TTS -> transcribe -> composition -> render -> verify -> YouTube upload,
# once the hook video is resolved one way or the other.

on:
  workflow_dispatch:
    inputs:
      case:
        description: "Case to cover (leave blank to auto-pick an unused one)"
        default: ""
  schedule:
    # 13:00 UTC = 18:30 IST, same daily slot the MindUnlocked channel posts in.
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 60 was sized for FLUX.1-schnell's 4-step stills (~5-10 min). The stills
    # step now runs PixArt-Sigma at 25 steps (~25-35 min), which does not fit
    # alongside case-pick + script + TTS inside a 60-minute job.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Python deps
        run: pip install --quiet anthropic "kaggle==2.2.2"

      - name: Pick case (skipped if one was supplied)
        id: pick
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Anthropic credits ran out, which stops this pipeline dead: script, title and
          # case pick all go through it. _pipeline/_llm.py speaks both dialects and
          # 'auto' uses Anthropic when its key is present, Fireworks otherwise. Set the
          # repo variable SHORT_LLM_PROVIDER to 'anthropic' to force it back later.
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          SHORT_LLM_PROVIDER: ${{ vars.SHORT_LLM_PROVIDER || 'auto' }}
          CASE: ${{ github.event.inputs.case }}
        run: python3 _pipeline/_pick_case.py # writes CASE to GITHUB_ENV and step output

      - name: Reserve next batch day number
        # Reserves the day number on the remote (a placeholder state.json
        # entry) BEFORE any expensive work happens, not after. This used to
        # be computed once from the initial checkout and only committed at
        # the very end (15-20 min later, after script + 16 FLUX stills), so
        # two runs overlapping in that window -- e.g. a manual dispatch
        # landing close to the scheduled run, or two scheduled runs during a
        # GitHub Actions cron delay -- could both compute the same "next
        # day", both burn ~15 min generating content, and then collide in a
        # git add/add conflict at the finish line, wasting the whole run
        # (hit in production 2026-08-08: a manual dispatch at 13:28 UTC and
        # the 13:38 UTC scheduled run both claimed day34). Reserving first
        # (a single small JSON commit, seconds not minutes) shrinks the
        # collision window from ~15 min to ~seconds, and retries with a
        # fresh day number on conflict instead of failing outright.
        id: day
        env:
          CASE: ${{ steps.pick.outputs.case }}
        run: |
          git config user.name "shadow-gasp-bot"
          git config user.email "bot@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            NEXT=$(python3 -c "
          import json
          state = json.load(open('_pipeline/batch/state.json'))
          days = [int(k) for k in state['days'].keys()]
          print((max(days) if days else 0) + 1)
          ")
            DD=$(printf "%02d" "$NEXT")
            python3 -c "
          import json, os
          p = '_pipeline/batch/state.json'
          state = json.load(open(p))
          state['days'][str($NEXT)] = {'case': os.environ['CASE'], 'angle': '', 'sheet_logged': False, 'done': False}
          json.dump(state, open(p, 'w'), indent=1)
          "
            git add _pipeline/batch/state.json
            git commit -m "batch: reserve day $DD ($CASE)"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "day=$NEXT" >> "$GITHUB_OUTPUT"
              echo "DAY_DIR=_pipeline/batch/day$DD" >> "$GITHUB_ENV"
              echo "Reserved day $DD on attempt $attempt"
              exit 0
            fi
            echo "day $DD collided with a concurrent run (attempt $attempt) — retrying with a fresh number"
          done
          echo "Could not reserve a batch day after 5 attempts — too much concurrent contention"
          exit 1

      - name: Scaffold day dir
        env:
          CASE: ${{ steps.pick.outputs.case }}
        run: |
          mkdir -p "$DAY_DIR/images/seq"
          python3 -c "
          import json, os
          json.dump({'case': os.environ['CASE']}, open(os.path.join(os.environ['DAY_DIR'], 'pick.json'), 'w'))
          "

      - name: Script + 16 shot prompts + meta
        working-directory: ${{ env.DAY_DIR }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Anthropic credits ran out, which stops this pipeline dead: script, title and
          # case pick all go through it. _pipeline/_llm.py speaks both dialects and
          # 'auto' uses Anthropic when its key is present, Fireworks otherwise. Set the
          # repo variable SHORT_LLM_PROVIDER to 'anthropic' to force it back later.
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          SHORT_LLM_PROVIDER: ${{ vars.SHORT_LLM_PROVIDER || 'auto' }}
          CASE: ${{ steps.pick.outputs.case }}
          # Reserve the case in the channel-wide ledger, not a copy inside the day dir.
          CASES_LEDGER: ${{ github.workspace }}/_pipeline/cases_used.json
        run: |
          cp ../../_gen_video_content.py ../../_llm.py .
          python3 _gen_video_content.py
          cp tc_narration.txt narration.txt
          cat narration.txt
          echo "--- shot prompts ---"
          python3 -c "import json; [print(s['n'], ':', s['prompt']) for s in json.load(open('shots.json'))]"

      - name: 16 stills — PixArt-Sigma on Kaggle GPU
        working-directory: ${{ env.DAY_DIR }}
        env:
          # Two separate Kaggle accounts by design (anuragmishra108=image-gen,
          # kianukal=video-gen) so FLUX and CogVideoX don't share one account's
          # GPU-hour quota. Running from _pipeline/batch/dayNN/ (not a fixed
          # "video/" dir) also gives each day's Kaggle kernel slug its own
          # name (_gen_flux_images.py derives SLUG from os.path.basename(cwd)),
          # fixing a real bug: every daily run used to reuse the same
          # "video-flux" kernel slug and could download the previous day's
          # stale stills if a status poll landed on the wrong terminal state.
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_IMAGE_API_TOKEN }}
          KAGGLE_IMAGE_USERNAME: ${{ secrets.KAGGLE_IMAGE_USERNAME }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cp ../../_gen_flux_images.py .
          python3 _gen_flux_images.py
          cp images/seq/01.jpeg shot1.jpeg

      - name: Commit day content + mark state.json done
        # The day NUMBER was already claimed and pushed by the reservation
        # step above, so this step only ever touches its own dayNN/
        # directory (unique to this run) plus flipping its own state.json
        # key from done:false to done:true -- a much smaller collision
        # surface than the old single end-of-run commit, but still retried
        # (cheap: just re-stages the same already-generated files) in case
        # another run's commit landed in between.
        env:
          DAY: ${{ steps.day.outputs.day }}
          CASE: ${{ steps.pick.outputs.case }}
        run: |
          git config user.name "shadow-gasp-bot"
          git config user.email "bot@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            # Always re-derive state.json from the freshest origin content
            # (not our possibly-stale local copy) before flipping our own
            # day's done flag, so a concurrent run's own commit in between
            # attempts is picked up instead of silently overwritten. The
            # dayNN/ files themselves live untouched in the working tree
            # regardless of which commit HEAD points to, so re-adding them
            # after moving HEAD is safe.
            git fetch origin "${GITHUB_REF_NAME}"
            git checkout "origin/${GITHUB_REF_NAME}" -- _pipeline/batch/state.json
            python3 -c "
          import json, os
          p = '_pipeline/batch/state.json'
          state = json.load(open(p))
          state['days'][os.environ['DAY']]['done'] = True
          json.dump(state, open(p, 'w'), indent=1)
          "
            git reset --mixed "origin/${GITHUB_REF_NAME}"
            git add "$DAY_DIR" _pipeline/cases_used.json _pipeline/batch/state.json
            git diff --cached --quiet || git commit -m "batch: day $(printf '%02d' "$DAY") content ($CASE)"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push collided (attempt $attempt) — resyncing and retrying"
          done
          echo "Could not commit day $DAY content after 5 attempts — too much concurrent contention"
          exit 1

      - name: Ask the Telegram bot to request a Google Flow hook video
        # Best-effort, never fails the job: the day's content is already
        # safely committed by this point (previous step), so a notify
        # hiccup must not lose that work the way it did in production on
        # 2026-08-08 (day34 generated fine, committed fine, but this step's
        # urllib call got a 403 and its uncaught exception failed the whole
        # job — leaving the day reserved+committed but nobody ever told to
        # send a hook video for it). continue-on-error plus a few curl
        # retries (curl, not urllib -- matches the client already proven
        # reliable against this same Worker endpoint pattern in
        # sweep_hook_waits.yml) covers both a genuine bug and a transient
        # edge hiccup; if all retries fail, the day is still fully valid
        # and recoverable manually via /day $DAY in Telegram.
        continue-on-error: true
        env:
          DAY: ${{ steps.day.outputs.day }}
          CASE: ${{ steps.pick.outputs.case }}
          BATCH_NOTIFY_SECRET: ${{ secrets.BATCH_NOTIFY_SECRET }}
        run: |
          BODY=$(python3 -c "import json, os; print(json.dumps({'day': os.environ['DAY'], 'case': os.environ['CASE']}))")
          for attempt in 1 2 3; do
            HTTP_CODE=$(curl -s -o /tmp/short_ready_resp.txt -w "%{http_code}" -X POST \
              "https://shadow-gasp-bot.everydayhypehq.workers.dev/short/ready" \
              -H "X-Batch-Notify-Secret: $BATCH_NOTIFY_SECRET" -H "Content-Type: application/json" \
              -d "$BODY")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Notified Telegram for day $DAY"
              exit 0
            fi
            echo "attempt $attempt: HTTP $HTTP_CODE — $(cat /tmp/short_ready_resp.txt)"
            sleep 5
          done
          echo "Could not notify Telegram after 3 attempts. Day $DAY's content is safely committed regardless — recover with: /day $DAY in Telegram."
          # Last resort: the /short/ready endpoint is what failed, so try the
          # failure endpoint instead. Without this the day sits fully generated
          # with nobody ever told to send it a hook video -- exactly what
          # happened on 2026-08-08.
          printf '{"day":"%s","job":"build","step":"Ask the Telegram bot to request a Google Flow hook video","run_url":"%s","chat_id":""}'             "$DAY" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /tmp/f.json
          curl -sS -X POST "https://shadow-gasp-bot.everydayhypehq.workers.dev/batch/failed"             -H "X-Batch-Notify-Secret: $BATCH_NOTIFY_SECRET" -H "Content-Type: application/json"             --data @/tmp/f.json || true

      - name: Tell Telegram the daily build failed, and which step
        # The 13:38 cron run on 2026-08-08 died on a 403 and reported to nobody;
        # the first anyone knew was that no video appeared. Never again.
        if: failure()
        continue-on-error: true
        env:
          DAY: ${{ steps.day.outputs.day }}
          BATCH_NOTIFY_SECRET: ${{ secrets.BATCH_NOTIFY_SECRET }}
          GH_TOKEN: ${{ github.token }}
        # The step-name lookup races the API: this step starts milliseconds
        # after the failing one exits, and the runner has not necessarily
        # reported that step's conclusion to the service yet -- so the query
        # matches nothing and the alert says 'step: unknown', which is exactly
        # the detail the alert exists to provide (day47, 2026-08-23). Poll a
        # few times before giving up.
        run: |
          for attempt in 1 2 3 4 5; do
            STEP=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
                     --jq '.jobs[] | select(.name=="build") | .steps[] | select(.conclusion=="failure") | .name' \
                     2>/dev/null | head -1)
            [ -n "$STEP" ] && break
            sleep 3
          done
          printf '{"day":"%s","job":"build (daily cron)","step":"%s","run_url":"%s","chat_id":""}'             "${DAY:-not yet reserved}" "${STEP:-unknown}"             "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /tmp/failed.json
          curl -sS -X POST "https://shadow-gasp-bot.everydayhypehq.workers.dev/batch/failed"             -H "X-Batch-Notify-Secret: $BATCH_NOTIFY_SECRET" -H "Content-Type: application/json"             --data @/tmp/failed.json || true
