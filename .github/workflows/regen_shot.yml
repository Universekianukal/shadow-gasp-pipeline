name: shadow_gasp regenerate one batch shot

# One-off fix for a single bad still (vision-QA-catchable artifact spotted
# after the fact, or found once the QA prompt itself gets strengthened)
# without burning GPU time re-doing all 16 shots for that day.

on:
  workflow_dispatch:
    inputs:
      day:
        description: "Batch day number (e.g. 9)"
        required: true
      shot:
        description: "Shot number to regenerate (1-16)"
        required: true
      kaggle_account:
        description: "Kaggle account slot for the stills: IMAGE (anuragmishra108), VIDEO (kianukal), MAHADEVI (mahadevi108). Case-sensitive, must match the KAGGLE_ACCOUNTS variable. Blank = the KAGGLE_IMAGE_ACCOUNT repo variable."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Python deps
        run: pip install --quiet anthropic "kaggle==2.2.2"

      - name: git identity
        run: |
          git config user.name "shadow-gasp-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Confirm the Kaggle account resolved
        # Ported from the comic pipeline, which hit this first. Two ways to
        # spend the wrong account's quota silently:
        #   1. the slot's secrets were never added -- secrets[...] is then an
        #      empty string, not an error;
        #   2. a typo'd slot ("video" vs "VIDEO") resolves to nothing the same way.
        # KAGGLE_ACCOUNTS maps slot -> handle in plain text (a username is not a
        # secret), which gives us something to compare the resolved credential
        # against. Emptiness alone does not catch case 2.
        env:
          SLOT: ${{ github.event.inputs.kaggle_account || vars.KAGGLE_IMAGE_ACCOUNT || 'IMAGE' }}
          ACCOUNT_MAP: ${{ vars.KAGGLE_ACCOUNTS }}
          KAGGLE_USERNAME: ${{ secrets[format('KAGGLE_{0}_USERNAME', github.event.inputs.kaggle_account || vars.KAGGLE_IMAGE_ACCOUNT || 'IMAGE')] }}
          KAGGLE_API_TOKEN: ${{ secrets[format('KAGGLE_{0}_API_TOKEN', github.event.inputs.kaggle_account || vars.KAGGLE_IMAGE_ACCOUNT || 'IMAGE')] }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "::error::kaggle_account='$SLOT' resolved to an empty credential. Add KAGGLE_${SLOT}_USERNAME and KAGGLE_${SLOT}_API_TOKEN to this repo, or pick a slot that exists."
            exit 1
          fi
          if [ -n "$ACCOUNT_MAP" ]; then
            WANT=$(printf '%s' "$ACCOUNT_MAP" | awk -v RS=, -F: -v s="$SLOT" '$1==s{print $2}')
            if [ -z "$WANT" ]; then
              echo "::error::Slot '$SLOT' is not listed in the KAGGLE_ACCOUNTS variable ($ACCOUNT_MAP). Refusing to guess which account to spend."
              exit 1
            fi
            if [ "$WANT" != "$KAGGLE_USERNAME" ]; then
              echo "::error::Slot '$SLOT' should be '$WANT' but the secrets resolved to a different account -- KAGGLE_${SLOT}_USERNAME is probably missing. Refusing to spend the wrong account's quota."
              exit 1
            fi
          fi
          echo "stills will run on Kaggle slot $SLOT${WANT:+ = $WANT}"

      - name: Refuse to start on an account with no GPU quota left
        # The guard above proves WHICH account we are about to spend; this
        # proves it CAN be spent. Kaggle answers `kernels push` with a queued
        # kernel rather than an error when the weekly quota is gone, so
        # without this the only signal is a job that never ends.
        env:
          KAGGLE_ACCOUNTS: ${{ vars.KAGGLE_ACCOUNTS }}
          KAGGLE_IMAGE_API_TOKEN: ${{ secrets.KAGGLE_IMAGE_API_TOKEN }}
          KAGGLE_VIDEO_API_TOKEN: ${{ secrets.KAGGLE_VIDEO_API_TOKEN }}
          KAGGLE_MAHADEVI_API_TOKEN: ${{ secrets.KAGGLE_MAHADEVI_API_TOKEN }}
          SLOT: ${{ github.event.inputs.kaggle_account || vars.KAGGLE_IMAGE_ACCOUNT || 'IMAGE' }}
        run: python3 $GITHUB_WORKSPACE/_pipeline/_kaggle_quota.py --require "$SLOT" --min-hours 1

      - name: Regenerate shot
        working-directory: _pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Account switch. Three accounts can generate stills:
          #   image    = anuragmishra108 (the default, image-gen)
          #   video    = kianukal        (also renders video; shares one quota)
          #   mahadevi = mahadevi108
          # Pick one per run with the kaggle_account input, or repo-wide with the
          # KAGGLE_IMAGE_ACCOUNT variable (input wins). Quota is per account and
          # refills weekly, so a day that stalls on one can be retried on another.
          # Nothing downstream changes -- the scripts read KAGGLE_API_TOKEN +
          # KAGGLE_IMAGE_USERNAME whichever account is selected.
          KAGGLE_API_TOKEN: ${{ secrets[format('KAGGLE_{0}_API_TOKEN', github.event.inputs.kaggle_account || vars.KAGGLE_IMAGE_ACCOUNT || 'IMAGE')] }}
          KAGGLE_IMAGE_USERNAME: ${{ secrets[format('KAGGLE_{0}_USERNAME', github.event.inputs.kaggle_account || vars.KAGGLE_IMAGE_ACCOUNT || 'IMAGE')] }}
        run: python3 _regen_shot.py "${{ github.event.inputs.day }}" "${{ github.event.inputs.shot }}"

      - name: Commit regenerated shot
        run: |
          DAY=$(printf "%02d" "${{ github.event.inputs.day }}")
          git add "_pipeline/batch/day$DAY"
          git diff --cached --quiet || git commit -m "regen: day $DAY shot ${{ github.event.inputs.shot }}"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
