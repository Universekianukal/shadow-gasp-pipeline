name: shadow_gasp regenerate one batch shot

# One-off fix for a single bad still (vision-QA-catchable artifact spotted
# after the fact, or found once the QA prompt itself gets strengthened)
# without burning GPU time re-doing all 16 shots for that day.

on:
  workflow_dispatch:
    inputs:
      day:
        description: "Batch day number (e.g. 9)"
        required: true
      shot:
        description: "Shot number to regenerate (1-16)"
        required: true
      kaggle_account:
        description: "Which Kaggle account generates the stills: image (anuragmishra108), video (kianukal), mahadevi (mahadevi108). Blank = whatever the KAGGLE_IMAGE_ACCOUNT repo variable says."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Python deps
        run: pip install --quiet anthropic "kaggle==2.2.2"

      - name: git identity
        run: |
          git config user.name "shadow-gasp-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Check the chosen Kaggle account actually has credentials
        # ${SELECTED} resolves through a chain of `&&/||` ternaries, and an
        # unset secret is an empty string, i.e. falsy -- so asking for an
        # account whose secrets were never added does not error, it silently
        # falls through to the image account. That is the one outcome a
        # human retrying on a different account must never get.
        env:
          ACCOUNT: ${{ (github.event.inputs.kaggle_account || vars.KAGGLE_IMAGE_ACCOUNT) == 'video' && 'video' || (github.event.inputs.kaggle_account || vars.KAGGLE_IMAGE_ACCOUNT) == 'mahadevi' && 'mahadevi' || 'image' }}
          TOKEN: ${{ (github.event.inputs.kaggle_account || vars.KAGGLE_IMAGE_ACCOUNT) == 'video' && secrets.KAGGLE_VIDEO_API_TOKEN || (github.event.inputs.kaggle_account || vars.KAGGLE_IMAGE_ACCOUNT) == 'mahadevi' && secrets.KAGGLE_MAHADEVI_API_TOKEN || secrets.KAGGLE_IMAGE_API_TOKEN }}
          USERNAME: ${{ (github.event.inputs.kaggle_account || vars.KAGGLE_IMAGE_ACCOUNT) == 'video' && secrets.KAGGLE_VIDEO_USERNAME || (github.event.inputs.kaggle_account || vars.KAGGLE_IMAGE_ACCOUNT) == 'mahadevi' && secrets.KAGGLE_MAHADEVI_USERNAME || secrets.KAGGLE_IMAGE_USERNAME }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$USERNAME" ]; then
            echo "::error::Kaggle account '$ACCOUNT' has no credentials in this repo."
            echo "Add the secrets for it before selecting it:"
            echo "  image    -> KAGGLE_IMAGE_API_TOKEN    + KAGGLE_IMAGE_USERNAME"
            echo "  video    -> KAGGLE_VIDEO_API_TOKEN    + KAGGLE_VIDEO_USERNAME"
            echo "  mahadevi -> KAGGLE_MAHADEVI_API_TOKEN + KAGGLE_MAHADEVI_USERNAME"
            exit 1
          fi
          echo "stills will run on Kaggle account '$ACCOUNT'"

      - name: Regenerate shot
        working-directory: _pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Account switch. Three accounts can generate stills:
          #   image    = anuragmishra108 (the default, image-gen)
          #   video    = kianukal        (also renders video; shares one quota)
          #   mahadevi = mahadevi108
          # Pick one per run with the kaggle_account input, or repo-wide with the
          # KAGGLE_IMAGE_ACCOUNT variable (input wins). Quota is per account and
          # refills weekly, so a day that stalls on one can be retried on another.
          # Nothing downstream changes -- the scripts read KAGGLE_API_TOKEN +
          # KAGGLE_IMAGE_USERNAME whichever account is selected.
          KAGGLE_API_TOKEN: ${{ (github.event.inputs.kaggle_account || vars.KAGGLE_IMAGE_ACCOUNT) == 'video' && secrets.KAGGLE_VIDEO_API_TOKEN || (github.event.inputs.kaggle_account || vars.KAGGLE_IMAGE_ACCOUNT) == 'mahadevi' && secrets.KAGGLE_MAHADEVI_API_TOKEN || secrets.KAGGLE_IMAGE_API_TOKEN }}
          KAGGLE_IMAGE_USERNAME: ${{ (github.event.inputs.kaggle_account || vars.KAGGLE_IMAGE_ACCOUNT) == 'video' && secrets.KAGGLE_VIDEO_USERNAME || (github.event.inputs.kaggle_account || vars.KAGGLE_IMAGE_ACCOUNT) == 'mahadevi' && secrets.KAGGLE_MAHADEVI_USERNAME || secrets.KAGGLE_IMAGE_USERNAME }}
        run: python3 _regen_shot.py "${{ github.event.inputs.day }}" "${{ github.event.inputs.shot }}"

      - name: Commit regenerated shot
        run: |
          DAY=$(printf "%02d" "${{ github.event.inputs.day }}")
          git add "_pipeline/batch/day$DAY"
          git diff --cached --quiet || git commit -m "regen: day $DAY shot ${{ github.event.inputs.shot }}"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
