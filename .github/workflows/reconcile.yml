name: shadow_gasp reconcile channel vs ledger

# The ledger records a videoId at upload and never revisits it. A manual re-upload -- routine
# when PUBLISH_AT lands in the past and the video goes out private -- gets a NEW id that nothing
# writes back, so the ledger keeps pointing at the deleted one.
#
# Default is review-only: it prints a proposed mapping and writes nothing. Pass `apply` with the
# confirmed pairs to commit them.

on:
  # Detection only. A manual upload -- or a re-upload after PUBLISH_AT left a video private --
  # is invisible to the pipeline: the new video is not in the ledger, so it never appears in
  # /topics and can never become a comic. Three such videos sat unnoticed for a month
  # (Cerro Gordo, Isdal Woman, the Radium Girls long-form), and three more days pointed at
  # videos that had been deleted.
  #
  # Nothing here writes anything. It reports, and only when there is something to report --
  # a job that says "all clear" every morning is a job you stop reading.
  schedule:
    - cron: "40 6 * * *"     # 06:40 UTC = 12:10 IST, well clear of the publish window

  workflow_dispatch:
    inputs:
      mode:
        description: "review | all | audit   (audit = which comic link sits on which video; all = print every channel video with its current linkage)"
        default: "review"
      describe:
        description: "Video ids to explain, comma separated (prints each story + closest cases)"
        default: ""
      apply:
        description: "Confirmed pairs, SEMICOLON separated: 33=H_u0xC8ay_A;34=KzDYKoxFev8. Blank = review only."
        default: ""

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python deps
        run: pip install --quiet google-api-python-client google-auth google-auth-oauthlib
      - name: Reconcile
        working-directory: _pipeline
        env:
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          if [ -n "${{ github.event.inputs.apply }}" ]; then
            python3 _reconcile_channel.py --apply "${{ github.event.inputs.apply }}"
          elif [ "${{ github.event.inputs.mode }}" = "audit" ]; then
            python3 _reconcile_channel.py --audit-links
          elif [ -n "${{ github.event.inputs.describe }}" ]; then
            python3 _reconcile_channel.py --describe "${{ github.event.inputs.describe }}"
          elif [ "${{ github.event.inputs.mode }}" = "all" ]; then
            python3 _reconcile_channel.py --all
          else
            python3 _reconcile_channel.py | tee /tmp/reconcile.txt
          fi

      # Report to Telegram ONLY when something is actually wrong. The findings have always been
      # printed -- _sync_youtube_status has listed unmatched videos on every 15-minute run for
      # weeks -- into a log nobody reads. That is how ten orphaned videos and three dead ids
      # accumulated unnoticed. Same lesson as the OCR contact sheets and the panel bounds audit:
      # a finding that does not reach a human is not a finding.
      - name: Tell Telegram if the channel and the ledger disagree
        if: ${{ always() && github.event.inputs.apply == '' && github.event.inputs.mode != 'audit' && github.event.inputs.mode != 'all' && github.event.inputs.describe == '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$CHAT_ID" ] || { echo "no TELEGRAM_CHAT_ID set, skipping notify"; exit 0; }
          ORPHANS=$(grep -oE "NO LEDGER ENTRY: [0-9]+" /tmp/reconcile.txt | grep -oE "[0-9]+" || echo 0)
          DEAD=$(grep -oE "NOT on the channel: [0-9]+" /tmp/reconcile.txt | grep -oE "[0-9]+" || echo 0)
          if [ "${ORPHANS:-0}" -eq 0 ] && [ "${DEAD:-0}" -eq 0 ]; then
            echo "channel and ledger agree, nothing to report"
            exit 0
          fi
          export ORPHANS DEAD
          python3 - <<'PY'
          import json, os, urllib.request
          body = open("/tmp/reconcile.txt", encoding="utf-8", errors="replace").read()[:2500]
          head = (
              f"⚠️ Channel and ledger disagree — {os.environ['ORPHANS']} video(s) "
              f"with no ledger entry, {os.environ['DEAD']} ledger id(s) no longer on the channel.\n\n"
              "A video the ledger does not know cannot become a comic: it never appears in "
              "/topics. A dead id means a comic would funnel to a video that no longer exists.\n\n"
              "Repair: run the Reconcile workflow with the confirmed pairs.\n\n"
          )
          data = json.dumps({"chat_id": os.environ["CHAT_ID"],
                             "text": (head + body)[:4000],
                             "disable_web_page_preview": True}).encode()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
              data=data, method="POST", headers={"Content-Type": "application/json"})
          print(urllib.request.urlopen(req).read().decode()[:200])
          PY
        continue-on-error: true
      - name: Commit the ledger if it changed
        if: github.event.inputs.apply != ''
        run: |
          git config user.name "shadow-gasp-bot"
          git config user.email "bot@users.noreply.github.com"
          git add _pipeline/cases_used.json
          git diff --cached --quiet || git commit -m "reconcile: link re-uploaded/manual videos to their days"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
