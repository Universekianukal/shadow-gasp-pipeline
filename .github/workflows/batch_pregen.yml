name: shadow_gasp 30-day batch pregen

# Pre-generates N days ahead: pick case -> script + 16 shot prompts -> 16 FLUX
# stills (Kaggle GPU) -> push day's shot-1 still -> log a row in the
# "shadow_gasp - 30 day batch" Google Sheet. Stops there — no TTS, no
# composition, no render, no upload. The hook clip for shot 1 is added later,
# by hand, via Google Flow (or CogVideoX as a fallback), once assembly resumes.
#
# _pipeline/_batch_pregen.py tracks progress in _pipeline/batch/state.json
# (committed each day), so this workflow only needs to process a small chunk
# per run — a single job is capped at 6 hours by GitHub regardless of plan,
# and each day's FLUX kernel alone takes ~10-20 min. Re-run with the same or a
# larger `days` input to continue where the last run left off.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many NEW days to process this run (resumes automatically)"
        default: "3"
      notify_chat_id:
        description: "Telegram chat id to notify when this chunk finishes (set by the bot; leave blank when triggered manually)"
        default: ""
      total:
        description: "Stop self-chaining once this many days are done in total. Blank = 30, the original batch size. Must be raised past the days already done or the chain ends on its first chunk."
        required: false
        default: ""
      kaggle_account:
        description: "Kaggle account slot for the stills: IMAGE (anuragmishra108), VIDEO (kianukal), MAHADEVI (mahadevi108). Case-sensitive, must match the KAGGLE_ACCOUNTS variable. Blank = the KAGGLE_IMAGE_ACCOUNT repo variable."
        required: false
        default: ""

permissions:
  contents: write
  actions: write # needed so the script can self-dispatch the next chunk

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # Both guards ported from pipeline.yml, which had them and this workflow
      # did not -- and this is the workflow that spends GPU on dozens of days
      # unattended, so a silent misfire here is far more expensive. They run
      # BEFORE any day is reserved: failing after the reserve manufactures the
      # orphaned state.json stub that stranded days 60 and 61.
      - name: Confirm the Kaggle account resolved
        # secrets[...] for a slot that was never configured, or a typo'd slot
        # ("video" vs "VIDEO"), is an empty string rather than an error -- which
        # falls straight through to the default account, i.e. exactly the
        # exhausted one a retry was trying to escape. Checking for non-empty
        # alone misses the typo case; compare the resolved username against
        # what KAGGLE_ACCOUNTS says the slot should be.
        env:
          SLOT: ${{ github.event.inputs.kaggle_account || vars.KAGGLE_IMAGE_ACCOUNT || 'IMAGE' }}
          ACCOUNT_MAP: ${{ vars.KAGGLE_ACCOUNTS }}
          KAGGLE_USERNAME: ${{ secrets[format('KAGGLE_{0}_USERNAME', github.event.inputs.kaggle_account || vars.KAGGLE_IMAGE_ACCOUNT || 'IMAGE')] }}
          KAGGLE_API_TOKEN: ${{ secrets[format('KAGGLE_{0}_API_TOKEN', github.event.inputs.kaggle_account || vars.KAGGLE_IMAGE_ACCOUNT || 'IMAGE')] }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "::error::kaggle_account='$SLOT' resolved to an empty credential. Add KAGGLE_${SLOT}_USERNAME and KAGGLE_${SLOT}_API_TOKEN to this repo, or pick a slot that exists."
            exit 1
          fi
          if [ -n "$ACCOUNT_MAP" ]; then
            WANT=$(printf '%s' "$ACCOUNT_MAP" | awk -v RS=, -F: -v s="$SLOT" '$1==s{print $2}')
            if [ -z "$WANT" ]; then
              echo "::error::Slot '$SLOT' is not listed in the KAGGLE_ACCOUNTS variable ($ACCOUNT_MAP). Refusing to guess which account to spend."
              exit 1
            fi
            if [ "$WANT" != "$KAGGLE_USERNAME" ]; then
              echo "::error::Slot '$SLOT' should be '$WANT' but the secrets resolved to a different account -- KAGGLE_${SLOT}_USERNAME is probably missing. Refusing to spend the wrong account's quota."
              exit 1
            fi
          fi
          echo "stills will run on Kaggle slot $SLOT${WANT:+ = $WANT}"

      - name: Report GPU quota on every account
        # Deliberately NOT --require. The batch script now fails over between
        # accounts by itself, so refusing to start because the *preferred* slot
        # is dry would block a run that another account could finish -- the
        # exact manual intervention the failover exists to remove. The script
        # raises if no slot has quota. This step is here for the log: when a
        # chunk does something surprising, the first question is always what
        # each account had left when it started.
        env:
          KAGGLE_ACCOUNTS: ${{ vars.KAGGLE_ACCOUNTS }}
          KAGGLE_IMAGE_API_TOKEN: ${{ secrets.KAGGLE_IMAGE_API_TOKEN }}
          KAGGLE_VIDEO_API_TOKEN: ${{ secrets.KAGGLE_VIDEO_API_TOKEN }}
          KAGGLE_MAHADEVI_API_TOKEN: ${{ secrets.KAGGLE_MAHADEVI_API_TOKEN }}
        run: python3 $GITHUB_WORKSPACE/_pipeline/_kaggle_quota.py

      - name: Python deps
        run: pip install --quiet anthropic "kaggle==2.2.2" google-api-python-client google-auth

      - name: Restore Sheets service-account key
        run: |
          mkdir -p _pipeline/_local
          printf '%s' '${{ secrets.SHEETS_SA_KEY }}' > _pipeline/_local/sheets_sa_key.json
          python3 -c "import json; json.load(open('_pipeline/_local/sheets_sa_key.json'))" # fail fast if malformed

      - name: git identity (batch script commits per-day progress)
        run: |
          git config user.name "shadow-gasp-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Run batch pregen
        working-directory: _pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Anthropic credits ran out, which stops this pipeline dead: script, title and
          # case pick all go through it. _pipeline/_llm.py speaks both dialects and
          # 'auto' uses Anthropic when its key is present, Fireworks otherwise. Set the
          # repo variable SHORT_LLM_PROVIDER to 'anthropic' to force it back later.
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          SHORT_LLM_PROVIDER: ${{ vars.SHORT_LLM_PROVIDER || 'auto' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Account switch. Three accounts can generate stills:
          #   image    = anuragmishra108 (the default, image-gen)
          #   video    = kianukal        (also renders video; shares one quota)
          #   mahadevi = mahadevi108
          # Pick one per run with the kaggle_account input, or repo-wide with the
          # KAGGLE_IMAGE_ACCOUNT variable (input wins). Quota is per account and
          # refills weekly, so a day that stalls on one can be retried on another.
          # Nothing downstream changes -- the scripts read KAGGLE_API_TOKEN +
          # KAGGLE_IMAGE_USERNAME whichever account is selected.
          KAGGLE_API_TOKEN: ${{ secrets[format('KAGGLE_{0}_API_TOKEN', github.event.inputs.kaggle_account || vars.KAGGLE_IMAGE_ACCOUNT || 'IMAGE')] }}
          KAGGLE_IMAGE_USERNAME: ${{ secrets[format('KAGGLE_{0}_USERNAME', github.event.inputs.kaggle_account || vars.KAGGLE_IMAGE_ACCOUNT || 'IMAGE')] }}
          # ⭐ EVERY account's credentials, not just the selected one. This is what
          # makes the failover possible: the script re-reads live quota between
          # days and, when the account it is on drops below what a day costs,
          # hands the next account's token straight to the kaggle CLI and keeps
          # going. Without these it can see (via KAGGLE_ACCOUNTS) that another
          # account exists but has no way to authenticate as it, so the run
          # would still stop dead and wait for a human to re-aim it.
          KAGGLE_ACCOUNTS: ${{ vars.KAGGLE_ACCOUNTS }}
          KAGGLE_IMAGE_API_TOKEN: ${{ secrets.KAGGLE_IMAGE_API_TOKEN }}
          KAGGLE_VIDEO_API_TOKEN: ${{ secrets.KAGGLE_VIDEO_API_TOKEN }}
          KAGGLE_MAHADEVI_API_TOKEN: ${{ secrets.KAGGLE_MAHADEVI_API_TOKEN }}
          NOTIFY_CHAT_ID: ${{ github.event.inputs.notify_chat_id }}
          BATCH_NOTIFY_SECRET: ${{ secrets.BATCH_NOTIFY_SECRET }}
          # Self-chaining: if fewer than BATCH_TOTAL_DAYS days are done after
          # this chunk, the script dispatches another run of this same workflow
          # with the same chunk size, account and total, so the whole batch
          # finishes unattended instead of needing a human to re-trigger every
          # chunk. ⚠️ This is a TOTAL, not an increment: it counts every day
          # ever done. Leaving it at the old hardcoded 30 once 61 days were
          # already done made the very first chunk report "batch complete" and
          # never chain.
          BATCH_TOTAL_DAYS: ${{ github.event.inputs.total }}
          # Passed back into the self-dispatch so the whole chain stays on the
          # account this run was aimed at. Without it every chained chunk falls
          # back to the KAGGLE_IMAGE_ACCOUNT variable, silently drifting off the
          # account whose quota was actually checked above.
          KAGGLE_SLOT: ${{ github.event.inputs.kaggle_account }}
          # Fallback preference when no slot was named on the dispatch, so the
          # failover starts from the same account the rest of the repo defaults to.
          KAGGLE_IMAGE_ACCOUNT: ${{ vars.KAGGLE_IMAGE_ACCOUNT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 _batch_pregen.py "${{ github.event.inputs.days }}"

      - name: Commit remaining state (in case the last day didn't push itself)
        run: |
          git add _pipeline/batch/state.json _pipeline/cases_used.json
          git diff --cached --quiet || git commit -m "batch pregen: progress checkpoint"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || true
