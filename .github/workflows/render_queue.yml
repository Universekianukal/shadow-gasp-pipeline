name: shadow_gasp render queue (04:30 IST)

# Renders ONE batch day per night; publish_queue.yml takes it live at 05:15 IST.
#
# Which day, in order:
#   1. a queue.json pending_render day, put there by a Telegram hook-video reply
#   2. otherwise the next ready batch day -- but ONLY as a safety net, if nothing
#      else is already covering the next slot (auto-advance, 2026-09-10)
#
# Auto-advance exists for the day you forget to send /publish. It must never
# add a video on top of one you already handled, so it stands down when:
#   * a day was published by hand today (IST), or
#   * a day is uploaded and SCHEDULED to go live later (PUBLISH_AT.txt), or
#   * a day is rendered and waiting for publish_queue (pending_publish).
# The scheduled case is the subtle one: `/publish <N> at <HH:MM>` uploads now
# and goes live later, so without PUBLISH_AT.txt (written by finish_batch_day)
# that day looks identical to one already live, and the sweep would publish a
# second video alongside it.
#
# A queued day with no hook clip is skipped, not dispatched: render_batch_day's
# hook gate would wait 15 min on Telegram then fail, burning the slot on a day
# that was never going to render.

on:
  schedule:
    # Moved earlier 2026-09-10. publish_queue.yml now holds until 23:40 UTC to
    # publish at 05:15 IST, so the render has to be FINISHED by then. The old
    # '0 23' cron actually started ~00:32-01:01 UTC and renders take 15-40 min,
    # which left as little as 30 min before publishing -- three of six recent
    # renders would have missed it and slipped a day. Starting here gives the
    # render roughly 1.5-2h of slack.
    - cron: '0 20 * * *'   # nominal 20:00 UTC; in practice starts ~21:30-22:00 UTC
  workflow_dispatch: {}     # manual test trigger

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }

      - name: Pick tonight's day and dispatch it
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_BASE: https://shadow-gasp-bot.everydayhypehq.workers.dev
          NOTIFY_SECRET: ${{ secrets.BATCH_NOTIFY_SECRET }}
        run: |
          git config user.name "shadow-gasp-bot"
          git config user.email "bot@users.noreply.github.com"

          # finish_batch_day.yml sets run-name "day <N> (upload=<bool>)" -- that
          # is the only place a manual /publish is visible to us.
          gh run list --workflow=finish_batch_day.yml --limit 60 \
            --json displayTitle,status,conclusion,createdAt > /tmp/manual_runs.json 2>/dev/null || true
          [ -s /tmp/manual_runs.json ] || echo '[]' > /tmp/manual_runs.json

          for i in 1 2 3; do
            git fetch origin main -q
            git reset --hard origin/main -q
            python3 - <<'PYEOF'
          import json, os, glob, datetime

          HOOK       = "_pipeline/batch/day{:02d}/images/seq/01.mp4".format
          UPLOADED   = "_pipeline/batch/day{:02d}/YOUTUBE_UPLOADED".format
          SCHEDULED  = "_pipeline/batch/day{:02d}/PUBLISH_AT.txt".format
          FIRST_AUTO_DAY, LAST_DAY = 47, 117   # 1-46 predate YOUTUBE_UPLOADED and are live

          path = "_pipeline/batch/queue.json"
          q = json.load(open(path)) if os.path.exists(path) else {}
          now = datetime.datetime.now(datetime.timezone.utc)

          chat = ""
          for v in q.values():
              chat = v.get("notify_chat_id") or chat

          def parse(ts):
              try:
                  return datetime.datetime.fromisoformat(ts.strip().replace("Z", "+00:00"))
              except ValueError:
                  return None

          # --- is the next slot already covered? -----------------------------
          # "today" is the IST calendar day; a fixed lookback long enough to
          # catch an early-morning publish also reaches into last evening and
          # would wrongly cancel the NEXT day's slot.
          IST = datetime.timedelta(hours=5, minutes=30)
          ist_midnight = (now + IST).replace(hour=0, minute=0, second=0, microsecond=0) - IST

          claimed, covered = set(), []
          for r in json.load(open("/tmp/manual_runs.json")):
              if r["status"] == "completed" and r["conclusion"] != "success":
                  continue          # a failed manual publish claims nothing
              bits = r["displayTitle"].split()
              if len(bits) > 1 and bits[0] == "day" and bits[1].isdigit():
                  claimed.add(int(bits[1]))
              t = parse(r["createdAt"])
              if t and t >= ist_midnight:
                  covered.append("day %s went out by hand today" % (bits[1] if len(bits) > 1 else "?"))

          for f in sorted(glob.glob("_pipeline/batch/day*/PUBLISH_AT.txt")):
              t = parse(open(f).read())
              if t and t > now:
                  day_n = os.path.basename(os.path.dirname(f))[3:]   # "day48" -> "48"
                  covered.append("day %s is scheduled for %s"
                                 % (day_n, t.strftime("%d %b %H:%M UTC")))

          for d, v in q.items():
              if v.get("status") == "pending_publish":
                  covered.append("day %s is rendered and publishes next" % d)

          # --- pick ----------------------------------------------------------
          dispatch, held, stepped_over = [], [], []

          for d, v in sorted(q.items(), key=lambda kv: int(kv[0])):
              if v.get("status") != "pending_render":
                  continue
              if os.path.exists(HOOK(int(d))):
                  v["status"] = "rendering"
                  dispatch.append((d, v.get("notify_chat_id") or chat))
              else:
                  v.update(status="held", prev_status="pending_render", held_at=now.isoformat(),
                           held_reason="no hook clip at images/seq/01.mp4 -- skipped by the 04:30 sweep")
                  held.append(d)

          if not dispatch and not covered:
              for n in range(FIRST_AUTO_DAY, LAST_DAY + 1):
                  if str(n) in q or n in claimed:
                      continue
                  if os.path.exists(UPLOADED(n)) or os.path.exists(SCHEDULED(n)):
                      continue
                  if not os.path.exists(HOOK(n)):
                      stepped_over.append(n)
                      continue
                  q[str(n)] = {"status": "rendering", "notify_chat_id": chat,
                               "queued_at": now.isoformat(), "auto_advanced": True}
                  dispatch.append((str(n), chat))
                  break

          with open("/tmp/pending_render_days.txt", "w") as f:
              for day, c in dispatch:
                  f.write(f"{day}\t{c}\n")

          note = []
          if held:
              note.append("held, no hook clip: " + ", ".join("day " + d for d in held))
          if stepped_over:
              note.append("stepped over, no hook clip: " + ", ".join("day %d" % n for n in stepped_over))
          if dispatch:
              note.append("rendering: " + ", ".join("day " + d for d, _ in dispatch))
          elif covered:
              note.append("standing down -- " + "; ".join(sorted(set(covered))))
          else:
              note.append("nothing to render -- every remaining day is missing its hook clip")
          open("/tmp/sweep_note.txt", "w").write("; ".join(note))

          json.dump(q, open(path, "w"), indent=2)
          PYEOF
            echo "sweep: $(cat /tmp/sweep_note.txt)"
            if git diff --quiet -- _pipeline/batch/queue.json; then break; fi
            git add _pipeline/batch/queue.json
            git commit -q -m "queue: 04:30 IST sweep -- $(cat /tmp/sweep_note.txt)"
            if git push origin HEAD:main; then break; fi
            echo "push conflict, retry $i"
            sleep $((RANDOM % 8 + 3))
          done

          if [ -s /tmp/pending_render_days.txt ]; then
            while IFS=$'\t' read -r day chat; do
              echo "Dispatching render for day $day (notify_chat_id=$chat)"
              gh workflow run render_batch_day.yml -f "day=$day" -f "notify_chat_id=$chat"
            done < /tmp/pending_render_days.txt
          fi

          # A day silently stepped over is exactly what goes unnoticed for a week.
          if [ -n "$NOTIFY_SECRET" ]; then
            python3 - <<'PYEOF' > /tmp/sweep_msg.json
          import json
          print(json.dumps({"text": "\U0001F3AC 04:30 sweep — " + open("/tmp/sweep_note.txt").read().strip()}))
          PYEOF
            curl -sS -X POST "$BOT_BASE/batch/notify-raw" \
              -H "X-Batch-Notify-Secret: $NOTIFY_SECRET" \
              -H "Content-Type: application/json" \
              --data @/tmp/sweep_msg.json || echo "could not reach the bot"
          fi
