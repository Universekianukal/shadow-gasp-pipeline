name: shadow_gasp render queue (04:30 IST)

# Renders ONE batch day per night; publish_queue.yml takes it live at 05:15 IST.
#
# Which day:
#   1. a queue.json pending_render day, put there by a Telegram hook-video reply
#   2. otherwise the next batch day that is ready  (auto-advance, 2026-09-10)
#
# Two rules, both added 2026-09-10:
#   * No hook clip at images/seq/01.mp4 -> never dispatched. render_batch_day.yml
#     would sit on its hook gate for 15 min and then fail, burning the night on a
#     day that was never going to render. Queued days are held with a reason;
#     auto-advance steps over them and takes the next ready day.
#   * A day already published by hand today -> the sweep does nothing. /publish <N>
#     goes straight to finish_batch_day.yml and never touches queue.json, so the
#     only way to see it is the Actions API. One video per IST day, either way.

on:
  schedule:
    - cron: '0 23 * * *'   # 23:00 UTC = 04:30 IST
  workflow_dispatch: {}     # manual test trigger

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }

      - name: Pick tonight's day and dispatch it
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_BASE: https://shadow-gasp-bot.everydayhypehq.workers.dev
          NOTIFY_SECRET: ${{ secrets.BATCH_NOTIFY_SECRET }}
        run: |
          git config user.name "shadow-gasp-bot"
          git config user.email "bot@users.noreply.github.com"

          # finish_batch_day.yml sets run-name "day <N> (upload=<bool>)" -- that
          # is where a manual /publish becomes visible to us.
          gh run list --workflow=finish_batch_day.yml --limit 60 \
            --json displayTitle,status,conclusion,createdAt > /tmp/manual_runs.json 2>/dev/null || true
          [ -s /tmp/manual_runs.json ] || echo '[]' > /tmp/manual_runs.json

          for i in 1 2 3; do
            git fetch origin main -q
            git reset --hard origin/main -q
            python3 - <<'PYEOF'
          import json, os, datetime

          HOOK     = "_pipeline/batch/day{:02d}/images/seq/01.mp4".format
          UPLOADED = "_pipeline/batch/day{:02d}/YOUTUBE_UPLOADED".format
          FIRST_AUTO_DAY, LAST_DAY = 47, 117   # 1-46 predate YOUTUBE_UPLOADED and are live

          path = "_pipeline/batch/queue.json"
          q = json.load(open(path)) if os.path.exists(path) else {}
          now = datetime.datetime.now(datetime.timezone.utc)

          # Reuse whichever chat the bot has been talking to, so an auto-advanced
          # day still reports failures somewhere.
          chat = ""
          for v in q.values():
              chat = v.get("notify_chat_id") or chat

          # Manual publishes: which days they claim, and whether one already went
          # out today. "Today" is the IST calendar day -- a fixed lookback would
          # wrongly cancel tomorrow's slot for an evening publish.
          IST = datetime.timedelta(hours=5, minutes=30)
          ist_midnight = (now + IST).replace(hour=0, minute=0, second=0, microsecond=0) - IST
          claimed, published_today = set(), False
          for r in json.load(open("/tmp/manual_runs.json")):
              # in flight, or finished successfully -- a failed run claims nothing
              if r["status"] == "completed" and r["conclusion"] != "success":
                  continue
              bits = r["displayTitle"].split()
              if len(bits) > 1 and bits[0] == "day" and bits[1].isdigit():
                  claimed.add(int(bits[1]))
              if datetime.datetime.fromisoformat(r["createdAt"].replace("Z", "+00:00")) >= ist_midnight:
                  published_today = True

          dispatch, held, stepped_over = [], [], []

          for d, v in sorted(q.items(), key=lambda kv: int(kv[0])):
              if v.get("status") != "pending_render":
                  continue
              if os.path.exists(HOOK(int(d))):
                  v["status"] = "rendering"
                  dispatch.append((d, v.get("notify_chat_id") or chat))
              else:
                  v.update(status="held", prev_status="pending_render",
                           held_at=now.isoformat(),
                           held_reason="no hook clip at images/seq/01.mp4 -- skipped by the 04:30 sweep")
                  held.append(d)

          # A day still waiting to publish IS tonight's video: its render ran long
          # and missed publish_queue by a few minutes, so it goes out tonight
          # instead. Rendering another day on top would publish two at once.
          waiting = [d for d, v in q.items() if v.get("status") == "pending_publish"]

          if not dispatch and not published_today and not waiting:
              for n in range(FIRST_AUTO_DAY, LAST_DAY + 1):
                  if str(n) in q or os.path.exists(UPLOADED(n)) or n in claimed:
                      continue
                  if not os.path.exists(HOOK(n)):
                      stepped_over.append(n)
                      continue
                  q[str(n)] = {"status": "rendering", "notify_chat_id": chat,
                               "queued_at": now.isoformat(), "auto_advanced": True}
                  dispatch.append((str(n), chat))
                  break

          with open("/tmp/pending_render_days.txt", "w") as f:
              for day, c in dispatch:
                  f.write(f"{day}\t{c}\n")

          note = []
          if held:
              note.append("held, no hook clip: " + ", ".join("day " + d for d in held))
          if stepped_over:
              note.append("stepped over, no hook clip: " + ", ".join("day %d" % n for n in stepped_over))
          if dispatch:
              note.append("rendering: " + ", ".join("day " + d for d, _ in dispatch))
          elif published_today:
              note.append("a day already went out by hand today -- standing down")
          elif waiting:
              note.append("standing down -- day %s is already rendered and publishes tonight"
                          % ", ".join(sorted(waiting, key=int)))
          else:
              note.append("nothing to render -- every remaining day is missing its hook clip")
          open("/tmp/sweep_note.txt", "w").write("; ".join(note))

          json.dump(q, open(path, "w"), indent=2)
          PYEOF
            echo "sweep: $(cat /tmp/sweep_note.txt)"
            if git diff --quiet -- _pipeline/batch/queue.json; then break; fi
            git add _pipeline/batch/queue.json
            git commit -q -m "queue: 04:30 IST sweep -- $(cat /tmp/sweep_note.txt)"
            if git push origin HEAD:main; then break; fi
            echo "push conflict, retry $i"
            sleep $((RANDOM % 8 + 3))
          done

          if [ -s /tmp/pending_render_days.txt ]; then
            while IFS=$'\t' read -r day chat; do
              echo "Dispatching render for day $day (notify_chat_id=$chat)"
              gh workflow run render_batch_day.yml -f "day=$day" -f "notify_chat_id=$chat"
            done < /tmp/pending_render_days.txt
          fi

          # A day silently stepped over is exactly what goes unnoticed for a week.
          if [ -n "$NOTIFY_SECRET" ]; then
            python3 - <<'PYEOF' > /tmp/sweep_msg.json
          import json
          print(json.dumps({"text": "\U0001F3AC 04:30 sweep — " + open("/tmp/sweep_note.txt").read().strip()}))
          PYEOF
            curl -sS -X POST "$BOT_BASE/batch/notify-raw" \
              -H "X-Batch-Notify-Secret: $NOTIFY_SECRET" \
              -H "Content-Type: application/json" \
              --data @/tmp/sweep_msg.json || echo "could not reach the bot"
          fi
