# Re-render an already-built batch day's 16 stills on the current image model.
#
# Why this exists: days 34-53 were generated by pipeline.yml while it still ran
# FLUX.1-schnell, after the batch path had already switched to PixArt-Sigma at
# day 10. That left a visible style break mid-channel. This workflow re-renders
# a FLUX-era day's stills on PixArt so the backlog matches days 10-33.
#
# It deliberately takes ONE day per dispatch rather than looping: each day is a
# ~25-35 min Kaggle GPU run, and a loop that dies halfway leaves some days with
# a half-deleted images/seq/. One day per run keeps every failure recoverable
# by just re-dispatching that day.
#
# SAFETY: refuses to touch a day that has already been published to YouTube
# (day41), since re-rendering it changes nothing live — the upload-scoped
# YouTube token cannot replace or delete an existing video, so a re-upload
# would only create a duplicate.
name: shadow_gasp backfill stills (PixArt)

on:
  workflow_dispatch:
    inputs:
      day:
        description: "Batch day number to re-render (e.g. 34)"
        required: true
        type: string
      replace_hook_clip:
        description: "Allow re-rendering a day that already has a Flow hook clip (the clip will need remaking)"
        required: false
        default: "false"
        type: string

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the published-day guard below reads `published:`
          # commit subjects, which a depth-1 checkout does not have.
          fetch-depth: 0

      - name: Python deps
        # Pinned to match pipeline.yml / batch_pregen.yml / regen_shot.yml —
        # this version is what reads KAGGLE_API_TOKEN from the env, so the
        # workflows get away with never writing a ~/.kaggle/kaggle.json.
        run: pip install --quiet "kaggle==2.2.2"

      - name: Resolve and guard the target day
        id: guard
        run: |
          set -euo pipefail
          DAY_NUM=$(printf '%d' "${{ inputs.day }}")
          DAY_DIR="_pipeline/batch/day${DAY_NUM}"
          if [ ! -d "$DAY_DIR" ]; then
            DAY_DIR=$(printf '_pipeline/batch/day%02d' "$DAY_NUM")
          fi
          if [ ! -d "$DAY_DIR" ]; then
            echo "::error::no such day directory for day $DAY_NUM"; exit 1
          fi
          if [ ! -f "$DAY_DIR/shots.json" ]; then
            echo "::error::$DAY_DIR has no shots.json — nothing to render from"; exit 1
          fi
          if [ -f "$DAY_DIR/YOUTUBE_UPLOADED" ]; then
            echo "::error::$DAY_DIR is already published to YouTube. Re-rendering it cannot replace the live video (the pipeline's OAuth token is upload-only), so this would burn a GPU run for no effect. Refusing."
            exit 1
          fi
          # The YOUTUBE_UPLOADED marker is NOT sufficient on its own: it was
          # introduced partway through, so days published by the older path
          # (34, 35, 37) never got one. Only day41 carries it. The reliable
          # signal is a `published: <case>` commit whose subject matches this
          # day's case in state.json -- that is how days 34/35/37 were found to
          # be live after a backfill had already rendered day34 for nothing.
          # Matched inside Python, not via `grep -F`: these case strings carry
          # em-dashes and curly quotes, and shelling the comparison out made the
          # match silently fail on day34 under a non-UTF-8 shell.
          python3 - "$DAY_NUM" <<'PY'
          import json, subprocess, sys
          n = int(sys.argv[1])
          s = json.load(open('_pipeline/batch/state.json', encoding='utf-8'))
          case = ''
          for k, v in (s.get('days', s)).items():
              if int(''.join(c for c in k if c.isdigit()) or 0) == n:
                  case = (v.get('case') or '').strip()
                  break
          if not case:
              print(f'day {n}: no case in state.json, skipping the published check')
              sys.exit(0)
          subjects = subprocess.run(
              ['git', 'log', '--format=%s'], capture_output=True, text=True,
              encoding='utf-8', errors='replace', check=True).stdout.splitlines()
          published = {x[len('published:'):].strip() for x in subjects
                       if x.startswith('published:')}
          if case in published:
              print(f'::error::day {n} ("{case}") already has a "published:" commit '
                    '— it is live on YouTube. Re-rendering cannot replace the live '
                    'video, so this would burn a GPU run for no effect. Refusing.')
              sys.exit(1)
          print(f'day {n} is not published — proceeding')
          PY
          # A hook clip was animated in Google Flow FROM the current shot1. Once
          # shot1 is re-rendered the clip no longer matches its own still, and a
          # new Flow clip has to be made by hand. That is the user's time, not
          # just GPU time, so it needs an explicit opt-in.
          if [ -f "$DAY_DIR/images/seq/01.mp4" ] && [ "${{ inputs.replace_hook_clip }}" != "true" ]; then
            echo "::error::$DAY_DIR already has a hook clip (images/seq/01.mp4) animated from the current shot1. Re-rendering the stills would leave that clip mismatched against its own still, and a replacement would have to be made in Flow by hand. Re-run with replace_hook_clip=true to accept that."
            exit 1
          fi
          echo "day_dir=$DAY_DIR" >> "$GITHUB_OUTPUT"
          echo "day_num=$DAY_NUM" >> "$GITHUB_OUTPUT"

      - name: Clear existing stills so the generator does not skip
        working-directory: ${{ steps.guard.outputs.day_dir }}
        run: |
          set -euo pipefail
          # _gen_flux_images.py returns early if images/seq/16.jpeg exists, so
          # the old stills have to go. Delete ONLY the .jpeg stills: images/seq
          # also holds 01.mp4, the Flow hook clip the user made by hand. An
          # earlier `rm -rf images/seq` here destroyed day34's clip (it survived
          # only because the commit never pushed). Days 34/35/37 have clips.
          rm -f images/seq/*.jpeg
          rm -rf _kaggle_flux_kernel
          mkdir -p images/seq
          echo "kept in images/seq:"; ls -la images/seq

      - name: 16 stills — PixArt-Sigma on Kaggle GPU
        working-directory: ${{ steps.guard.outputs.day_dir }}
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_IMAGE_API_TOKEN }}
          KAGGLE_IMAGE_USERNAME: ${{ secrets.KAGGLE_IMAGE_USERNAME }}
        run: |
          set -euo pipefail
          cp ../../_gen_flux_images.py .
          python3 _gen_flux_images.py
          cp images/seq/01.jpeg shot1.jpeg

      - name: Verify all 16 landed before committing
        working-directory: ${{ steps.guard.outputs.day_dir }}
        run: |
          set -euo pipefail
          missing=""
          for i in $(seq -w 1 16); do
            [ -s "images/seq/${i}.jpeg" ] || missing="$missing $i"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing or empty stills:$missing — not committing a partial day"; exit 1
          fi
          if [ -f images/seq/FLAGGED.txt ]; then
            echo "::warning::the kernel flagged shots for manual review:"
            cat images/seq/FLAGGED.txt
          fi

      - name: Commit re-rendered stills
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage the whole day dir, not just images/seq + shot1: the stills
          # step copies _gen_flux_images.py into it, and that file is tracked
          # for days 34+. Leaving it modified-but-unstaged made every
          # `git pull --rebase` below abort with "cannot pull with rebase: You
          # have unstaged changes", which is what failed day34's first run
          # after a successful 20-minute GPU render.
          git add -A -f "${{ steps.guard.outputs.day_dir }}"
          if git diff --cached --quiet; then
            echo "no change to commit"; exit 0
          fi
          # Anything still unstaged at this point would break the rebase again.
          git status --porcelain
          git commit -m "batch: day ${{ steps.guard.outputs.day_num }} stills re-rendered on PixArt-Sigma"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push attempt $attempt failed, retrying"; sleep $((attempt * 10))
          done
          echo "::error::could not push after 3 attempts"; exit 1
