name: shadow_gasp finish batch day (render + publish)

# Takes a batch day that already has its hook video + TTS narration added
# (_pipeline/batch/dayNN/ with tc_narration.wav and images/01.mp4 committed —
# see _batch_pregen.py and the manual finish-up steps after Google Flow) and
# runs the SAME proven render recipe as pipeline.yml's render/upload jobs:
# transcribe -> build composition -> render (Chrome headless, cloud runner
# only — this pipeline's heavy compositions don't render reliably on a
# laptop) -> verify -> YouTube metadata -> optional upload.

on:
  workflow_dispatch:
    inputs:
      day:
        description: "Batch day number (e.g. 1 for day01)"
        required: true
      upload:
        description: "Upload final.mp4 to YouTube after render"
        type: boolean
        default: false
      publish_at:
        description: "RFC3339 UTC to schedule instead of publishing immediately (e.g. 2026-07-30T23:45:00Z). Leave blank for immediate."
        default: ""
      notify_chat_id:
        description: "Telegram chat id to confirm upload to (set by the bot; leave blank when triggered manually)"
        default: ""
      use_cog_fallback:
        description: "If no Flow hook video is committed, generate one with CogVideoX (~50 min Kaggle GPU) instead of falling back to a static Ken Burns still"
        type: boolean
        default: false
      youtube_upload:
        description: "Upload to YouTube. Turn OFF when re-rendering a day that's already live on YouTube (e.g. re-grading a render) so it isn't uploaded twice."
        type: boolean
        default: true
      force_youtube_upload:
        description: "Re-upload to YouTube even if this day already has a video. Normally auto-skipped once a day is marked uploaded."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      case: ${{ steps.pick.outputs.case }}
    steps:
      # ref: main, NOT the default github.sha. The bot commits the Telegram hook
      # clip and dispatches this workflow within a few seconds, and GitHub pins
      # a workflow_dispatch run to the branch tip AS IT RESOLVED IT AT DISPATCH
      # TIME -- which loses that race. Real case 2026-08-09: hook committed at
      # 13:18:20Z, dispatched 13:18:24Z, run checked out the PARENT commit, and
      # the render silently degraded to a static Ken Burns still because
      # images/seq/01.mp4 "did not exist". Resolving the branch at checkout time
      # always sees the clip.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve day dir + case
        id: pick
        run: |
          DAY=$(printf "%02d" "${{ github.event.inputs.day }}")
          echo "DAY_DIR=_pipeline/batch/day$DAY" >> "$GITHUB_ENV"
          CASE=$(python3 -c "import json; print(json.load(open('_pipeline/batch/day$DAY/pick.json'))['case'])")
          echo "case=$CASE" >> "$GITHUB_OUTPUT"
          echo "Rendering day $DAY: $CASE"

      - name: Hook video — use the committed Google Flow clip, or fall back to CogVideoX
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_VIDEO_API_TOKEN }}
          KAGGLE_VIDEO_USERNAME: ${{ secrets.KAGGLE_VIDEO_USERNAME }}
        run: |
          if [ -f "$DAY_DIR/images/seq/01.mp4" ]; then
            echo "Using the committed Google Flow hook video"
            echo "FLOW_HOOK=1" >> "$GITHUB_ENV"
          elif [ "${{ github.event.inputs.use_cog_fallback }}" = "true" ]; then
            # Opt-in only -- Flow (manual, via Telegram) is the default path.
            # CogVideoX-5b costs ~50 min of Kaggle GPU time (sequential offload
            # + 20 steps, tuned down from the original ~82 min); only worth it
            # when explicitly requested.
            echo "No Flow video for day $DAY — use_cog_fallback=true, running CogVideoX (~50 min)"
            pip install --quiet "kaggle==2.2.2"
            cp _pipeline/_gen_cog_hook.py "$DAY_DIR/"
            (cd "$DAY_DIR" && python3 _gen_cog_hook.py) || echo "CogVideoX fallback failed — composition will degrade to a static Ken Burns hook still"
            echo "FLOW_HOOK=0" >> "$GITHUB_ENV"
          else
            echo "No Flow video for day $DAY and use_cog_fallback is not set — composition will degrade to a static Ken Burns hook still"
            echo "FLOW_HOOK=0" >> "$GITHUB_ENV"
          fi
          # _batch_pregen.py named it narration.txt; _tts.py/_gen_youtube_meta.py
          # (shared with the main pipeline) expect tc_narration.txt — alias it.
          cp "$DAY_DIR/narration.txt" "$DAY_DIR/tc_narration.txt"

      - name: No hook video — ask Telegram whether to stop, before burning a render
        id: hookgate
        # The whole point: a missing hook clip used to degrade to a static Ken
        # Burns still and PUBLISH, so you only found out by watching the video.
        # Now the run pauses here, says why, and defaults to STOP on silence.
        # Gated on notify_chat_id so manual dispatches (no Telegram involved)
        # keep their old fire-and-forget behaviour.
        if: env.FLOW_HOOK == '0' && github.event.inputs.notify_chat_id != ''
        env:
          BASE: https://shadow-gasp-bot.everydayhypehq.workers.dev
          SECRET: ${{ secrets.BATCH_NOTIFY_SECRET }}
          CHAT: ${{ github.event.inputs.notify_chat_id }}
          DAY: ${{ github.event.inputs.day }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          REASON="$DAY_DIR/images/seq/01.mp4 is not present at this commit ($GITHUB_SHA)"
          printf '{"day":"%s","run_id":"%s","run_url":"%s","reason":"%s","chat_id":"%s"}'             "$DAY" "$GITHUB_RUN_ID" "$RUN_URL" "$REASON" "$CHAT" > /tmp/hookmissing.json
          curl -sS -X POST "$BASE/batch/hookmissing"             -H "X-Batch-Notify-Secret: $SECRET" -H "Content-Type: application/json"             --data @/tmp/hookmissing.json || echo "could not reach the bot"

          # 90 x 10s = 15 min, then default to STOP. Silence must never mean
          # "go ahead and publish it hookless".
          for i in $(seq 1 90); do
            D=$(curl -sS "$BASE/batch/hookdecision?run_id=$GITHUB_RUN_ID"                   -H "X-Batch-Notify-Secret: $SECRET" | grep -o '"decision":"[a-z]*"' | cut -d'"' -f4)
            if [ "$D" = "stop" ]; then
              echo "::error::Stopped from Telegram — day $DAY has no hook video"
              exit 1
            elif [ "$D" = "go" ]; then
              echo "Confirmed from Telegram: continue with a static still"
              exit 0
            fi
            sleep 10
          done
          echo "::error::No answer from Telegram in 15 min — stopping rather than publishing a hookless video"
          exit 1

      - name: Clean the Flow hook video — remove the Flow sparkle, strip audio, fix color-range metadata
        # Runs the SAME dewatermark tool the user runs locally
        # (_pipeline/dewatermark/, alpha-matte inversion) rather than ffmpeg's
        # delogo. delogo interpolates flat colour in from a box edge, which
        # reads as an obvious dark smudge; this inverts the alpha compositing
        # algebraically and recovers the real pixels underneath, calibrating
        # the alpha per clip against watermark-free control patches. It also
        # detects first and SKIPS a clip that has no watermark, so an already
        # cleaned upload is never double-processed.
        #
        # After cleaning, a single re-encode strips Flow's own audio (it bled
        # into the narration mix on Sodder Fire) and sets explicit
        # color-range/colorspace tags — without them the HyperFrames render
        # step fails outright with a "deprecated pixel format" swscale error.
        #
        # Finally it drops an 01.PREWASHED marker, which tells
        # _build_composition.py not to paint its #wmPatch black ellipse over
        # the corner: that cover-up exists only for a watermark this step has
        # now actually removed.
        if: env.FLOW_HOOK == '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet opencv-python-headless numpy
          IN="$DAY_DIR/images/seq/01.mp4"
          SEQ="$DAY_DIR/images/seq"

          if [ -f "$SEQ/01.PREWASHED" ]; then
            echo "01.PREWASHED present — clip was already cleaned before upload"
          else
            python3 _pipeline/dewatermark/dewatermark.py "$IN" -o "$SEQ/01_dwm.mp4"
            if [ -f "$SEQ/01_dwm.mp4" ]; then
              mv "$SEQ/01_dwm.mp4" "$IN"
            else
              # No output means the detector found no watermark and skipped the
              # file, which is a valid outcome, not a failure.
              echo "no watermark detected — hook clip left as uploaded"
            fi
          fi

          ffmpeg -y -i "$IN" -an             -color_range tv -colorspace bt709 -color_primaries bt709 -color_trc bt709             -c:v libx264 -crf 18 -preset medium -pix_fmt yuv420p             "$SEQ/01_norm.mp4"
          mv "$SEQ/01_norm.mp4" "$IN"
          touch "$SEQ/01.PREWASHED"

      - name: Python deps
        run: pip install --quiet anthropic faster-whisper kokoro-onnx soundfile numpy

      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" || true
      - name: Chrome sandbox (Ubuntu 24)
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns || true
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: FFmpeg + fonts
        # Installed before Build composition, not after — _build_composition.py's
        # prep_music() shells out to ffmpeg to loop/trim the bed track.
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends -qq ffmpeg fonts-montserrat

      - name: Cache TTS + whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/hyperframes
          key: hyperframes-media-cache-v1-${{ runner.os }}

      - name: TTS (skips if already committed for this day)
        working-directory: ${{ env.DAY_DIR }}
        run: |
          if [ -f tc_narration.wav ]; then
            echo "tc_narration.wav already committed, skipping TTS"
          else
            cp ../../_tts.py .
            mkdir -p ~/.cache/hyperframes/tts/models ~/.cache/hyperframes/tts/voices
            [ -f ~/.cache/hyperframes/tts/models/kokoro-v1.0.onnx ] || curl -sL -o ~/.cache/hyperframes/tts/models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
            [ -f ~/.cache/hyperframes/tts/voices/voices-v1.0.bin ] || curl -sL -o ~/.cache/hyperframes/tts/voices/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
            python3 _tts.py
          fi
          test -f tc_narration.wav || { echo "tc_narration.wav not produced"; exit 1; }

      - name: Transcribe (word timestamps)
        working-directory: ${{ env.DAY_DIR }}
        run: |
          cp ../../_transcribe.py .
          python3 _transcribe.py
          test -f transcript.json || { echo "transcript.json not produced"; exit 1; }

      - name: Build composition
        working-directory: ${{ env.DAY_DIR }}
        run: |
          cp ../../_build_composition.py ../../_composition_template.html .
          [ -f music/bed.wav ] || { mkdir -p music; cp ../../assets/bed.wav music/bed.wav; }
          python3 _build_composition.py
          test -f index.html || { echo "index.html not produced"; exit 1; }

      - name: YouTube metadata
        working-directory: ${{ env.DAY_DIR }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cp ../../_gen_youtube_meta.py .
          python3 _gen_youtube_meta.py

      - name: Cache HyperFrames
        uses: actions/cache@v4
        with:
          path: ~/.cache/hyperframes
          key: hyperframes-cache-v1-${{ runner.os }}

      - name: Install chrome-headless-shell
        run: |
          out=$(npx --yes @puppeteer/browsers install chrome-headless-shell@131.0.6778.85 --path "$HOME/.cache/hyperframes/puppeteer")
          p=$(echo "$out" | tail -1 | cut -d' ' -f2-)
          test -x "$p" || { echo "chrome-headless-shell not executable: $p"; exit 1; }
          echo "HYPERFRAMES_BROWSER_PATH=$p" >> "$GITHUB_ENV"

      - name: Render (retry — Puppeteer detaches intermittently on this comp)
        working-directory: ${{ env.DAY_DIR }}
        run: |
          for attempt in 1 2 3; do
            echo "=== render attempt $attempt ==="
            npx --yes hyperframes@0.6.80 render \
              --fps 30 -o final.mp4 \
              --workers 1 --low-memory-mode \
              --quality high \
              --browser-timeout 300 --protocol-timeout 900000 --player-ready-timeout 180000 \
              && break
            echo "attempt $attempt failed"
            [ "$attempt" = "3" ] && exit 1
            sleep 20
          done
          test -f final.mp4

      - name: Color grade — punchier contrast/saturation, cooler white balance, sharpened (cosmetic, applied to the one final.mp4 every platform uploads)
        # Not a substitute for anything platform-side (Facebook's in-app camera
        # filters aren't reachable via the Graph API at all — this is a plain
        # ffmpeg grade baked into the render itself so YouTube/FB/IG all get
        # the same look). Strength picked to closely approximate the punchier,
        # cooler look the user was applying by hand before switching to the
        # automated cross-post pipeline; retune eq=/colorbalance=/unsharp= below
        # if a render comes out over- or under-graded.
        working-directory: ${{ env.DAY_DIR }}
        run: |
          ffmpeg -y -i final.mp4 \
            -vf "eq=contrast=1.18:saturation=1.3:brightness=0.02,colorbalance=rs=-0.08:gs=-0.03:bs=0.10:rm=-0.05:gm=-0.02:bm=0.07:rh=-0.03:bh=0.05,unsharp=5:5:0.8:5:5:0.0" \
            -color_range tv -colorspace bt709 -color_primaries bt709 -color_trc bt709 \
            -c:v libx264 -crf 18 -preset medium -pix_fmt yuv420p -c:a copy \
            final_graded.mp4
          mv final_graded.mp4 final.mp4

      - name: Verify (duration, live frames, audio present)
        working-directory: ${{ env.DAY_DIR }}
        run: |
          ffprobe -v error -show_entries format=duration:format=size -of default=nw=1 final.mp4
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 final.mp4)
          python3 -c "
          d = float('$DUR')
          assert 40 <= d <= 180, f'suspicious duration {d}s'
          print(f'duration ok: {d:.1f}s')"
          ffprobe -v error -select_streams a -show_entries stream=codec_type -of csv=p=0 final.mp4 | grep -q audio || { echo "no audio track"; exit 1; }
          ffmpeg -y -loglevel error -ss 2 -i final.mp4 -frames:v 1 /tmp/f0.png
          ffmpeg -y -loglevel error -ss "$(python3 -c "print(float('$DUR')/2)")" -i final.mp4 -frames:v 1 /tmp/f1.png
          [ "$(md5sum /tmp/f0.png|cut -d' ' -f1)" != "$(md5sum /tmp/f1.png|cut -d' ' -f1)" ] || { echo "identical frames"; exit 1; }

      - name: Tell Telegram this job failed, and which step
        # Every failure mode before this reached you as silence: the run went
        # red in a tab nobody opens, and the day simply never appeared.
        # Skipped when the hook gate stopped the run on purpose -- that is a
        # decision you already made in Telegram, not a crash to report twice.
        if: failure() && steps.hookgate.conclusion != 'failure'
        continue-on-error: true
        env:
          BASE: https://shadow-gasp-bot.everydayhypehq.workers.dev
          SECRET: ${{ secrets.BATCH_NOTIFY_SECRET }}
          CHAT: ${{ github.event.inputs.notify_chat_id }}
          DAY: ${{ github.event.inputs.day }}
          JOB: render
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Name the step that actually failed, rather than making the user go
          # and read the log to find out.
          STEP=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs"                  --jq '.jobs[] | select(.name=="'"$JOB"'") | .steps[] | select(.conclusion=="failure") | .name'                  2>/dev/null | head -1)
          printf '{"day":"%s","job":"%s","step":"%s","run_url":"%s","chat_id":"%s"}'             "$DAY" "$JOB" "${STEP:-unknown}" "$RUN_URL" "$CHAT" > /tmp/failed.json
          curl -sS -X POST "$BASE/batch/failed"             -H "X-Batch-Notify-Secret: $SECRET" -H "Content-Type: application/json"             --data @/tmp/failed.json || true

      - uses: actions/upload-artifact@v4
        with:
          name: batch-day-${{ github.event.inputs.day }}-final
          path: |
            ${{ env.DAY_DIR }}/final.mp4
            ${{ env.DAY_DIR }}/youtube.json
          retention-days: 30
          if-no-files-found: error

  upload:
    needs: render
    if: ${{ github.event.inputs.upload == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Resolve day dir
        run: |
          DAY=$(printf "%02d" "${{ github.event.inputs.day }}")
          echo "DAY_DIR=_pipeline/batch/day$DAY" >> "$GITHUB_ENV"
      - name: Python deps
        run: pip install --quiet google-api-python-client google-auth-oauthlib requests cloudinary
      - uses: actions/download-artifact@v4
        with:
          name: batch-day-${{ github.event.inputs.day }}-final
      - name: Upload to YouTube + stamp ledger
        id: upload
        if: ${{ github.event.inputs.youtube_upload != 'false' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          CASE: ${{ needs.render.outputs.case }}
          PUBLISH_AT: ${{ github.event.inputs.publish_at }}
          DAY_DIR: ${{ env.DAY_DIR }}
          FORCE_YOUTUBE_UPLOAD: ${{ github.event.inputs.force_youtube_upload }}
        # pipefail matters here: without it the exit status is tee's, so a
        # failed upload (day33 hit a 400 invalidTitle) reported the whole job
        # as green while nothing reached YouTube.
        run: |
          set -o pipefail
          python3 _pipeline/_youtube_upload.py | tee /tmp/upload.log

      - name: Upload to Drive (real playable link for Telegram — Telegram's own 50MB bot-file limit can't take the ~100MB render directly)
        id: drive
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
        run: python3 _pipeline/_drive_upload.py "shadow_gasp_day${{ github.event.inputs.day }}.mp4" | tee /tmp/drive.log

      - name: Upload to Cloudinary (direct no-login download link for Telegram)
        id: cloudinary
        continue-on-error: true
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python3 _pipeline/_cloudinary_upload.py "shadow_gasp_day${{ github.event.inputs.day }}" | tee /tmp/cloudinary.log

      - name: Commit permanent Cloudinary link + videoId to ledger
        # CLOUDINARY_LINK.txt is what crosspost_decision.yml reads whenever
        # Facebook/Instagram eventually get approved via Telegram -- could be
        # minutes or weeks later, well past the ~7-day artifact retention, so
        # this has to be committed to git, not just printed to a log.
        run: |
          git config user.name "shadow-gasp-bot"
          git config user.email "bot@users.noreply.github.com"
          CLOUDINARY_LINK=$(grep -o 'cloudinary_link=.*' /tmp/cloudinary.log 2>/dev/null | cut -d= -f2-)
          [ -n "$CLOUDINARY_LINK" ] && echo -n "$CLOUDINARY_LINK" > "$DAY_DIR/CLOUDINARY_LINK.txt"
          git add _pipeline/cases_used.json "$DAY_DIR/YOUTUBE_UPLOADED" "$DAY_DIR/CLOUDINARY_LINK.txt" 2>/dev/null
          git diff --cached --quiet || git commit -m "published: ${{ needs.render.outputs.case }}"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Tell Telegram this job failed, and which step
        # Every failure mode before this reached you as silence: the run went
        # red in a tab nobody opens, and the day simply never appeared.
        if: failure()
        continue-on-error: true
        env:
          BASE: https://shadow-gasp-bot.everydayhypehq.workers.dev
          SECRET: ${{ secrets.BATCH_NOTIFY_SECRET }}
          CHAT: ${{ github.event.inputs.notify_chat_id }}
          DAY: ${{ github.event.inputs.day }}
          JOB: upload
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Name the step that actually failed, rather than making the user go
          # and read the log to find out.
          STEP=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs"                  --jq '.jobs[] | select(.name=="'"$JOB"'") | .steps[] | select(.conclusion=="failure") | .name'                  2>/dev/null | head -1)
          printf '{"day":"%s","job":"%s","step":"%s","run_url":"%s","chat_id":"%s"}'             "$DAY" "$JOB" "${STEP:-unknown}" "$RUN_URL" "$CHAT" > /tmp/failed.json
          curl -sS -X POST "$BASE/batch/failed"             -H "X-Batch-Notify-Secret: $SECRET" -H "Content-Type: application/json"             --data @/tmp/failed.json || true

      - name: Notify Telegram (best-effort, never fails the upload)
        if: always()
        continue-on-error: true
        env:
          # Passed as env vars, not interpolated into a shell/python string
          # literal -- case names are free-form LLM output and can contain
          # quotes, which would otherwise break out of an inline literal.
          DAY: ${{ github.event.inputs.day }}
          CASE_NAME: ${{ needs.render.outputs.case }}
          NOTIFY_CHAT_ID: ${{ github.event.inputs.notify_chat_id }}
          BATCH_NOTIFY_SECRET: ${{ secrets.BATCH_NOTIFY_SECRET }}
        run: |
          # video_id only exists when youtube_upload wasn't skipped. Facebook/
          # Instagram no longer post from this job at all -- the Worker
          # attaches FB/IG Approve/Reject buttons to this same message once
          # video_id is present (see /batch/uploaded's fbIgDecisionKeyboard);
          # actual posting happens later via crosspost_decision.yml.
          VIDEO_ID=$(grep -o 'video_id=.*' /tmp/upload.log 2>/dev/null | cut -d= -f2)
          if [ -z "$VIDEO_ID" ]; then
            echo "no video_id found — nothing published this run, skipping notify"
            exit 0
          fi
          DRIVE_LINK=$(grep -o 'drive_link=.*' /tmp/drive.log | cut -d= -f2-)
          CLOUDINARY_LINK=$(grep -o 'cloudinary_link=.*' /tmp/cloudinary.log | cut -d= -f2-)
          VIDEO_ID="$VIDEO_ID" DRIVE_LINK="$DRIVE_LINK" CLOUDINARY_LINK="$CLOUDINARY_LINK" python3 -c "
          import json, os, urllib.request
          # title/hashtags come from this day's own youtube.json (same file
          # already in the artifact from the render job) rather than a shell
          # env var, since titles are free-form LLM output that can contain
          # quotes -- reading the file directly sidesteps shell-quoting entirely.
          title, hashtags = None, None
          try:
              meta = json.load(open(os.path.join(os.environ.get('DAY_DIR', ''), 'youtube.json')))
              title = meta.get('title') or None
              tags = meta.get('tags') or []
              hashtags = ' '.join('#' + t.replace(' ', '') for t in tags) or None
          except Exception:
              pass
          body = json.dumps({
              'day': os.environ['DAY'],
              'case': os.environ.get('CASE_NAME', ''),
              'title': title,
              'hashtags': hashtags,
              'video_id': os.environ.get('VIDEO_ID') or None,
              'drive_link': os.environ.get('DRIVE_LINK') or None,
              'cloudinary_link': os.environ.get('CLOUDINARY_LINK') or None,
              'chat_id': os.environ.get('NOTIFY_CHAT_ID') or None,
          }).encode()
          req = urllib.request.Request(
              'https://shadow-gasp-bot.everydayhypehq.workers.dev/batch/uploaded',
              data=body, method='POST',
              # Cloudflare's bot-protection (error 1010) fingerprints and
              # blocks Python urllib's default User-Agent before the request
              # ever reaches the Worker -- a browser-like UA is the fix, this
              # is NOT related to the X-Batch-Notify-Secret check below.
