name: shadow_gasp yt diagnostic (one-off, manual only)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: privacyStatus + viewCount for recent uploads
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          pip install --quiet google-auth google-auth-oauthlib google-api-python-client
          python3 - <<'PYEOF'
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          creds = Credentials(
              None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              token_uri="https://oauth2.googleapis.com/token",
          )
          yt = build("youtube", "v3", credentials=creds)

          ids = {
              "7ArPABc6RxU": "day37 2026-08-12",
              "KzDYKoxFev8": "day34 2026-08-10-ish",
              "vU_D1DSkvrs": "day35",
          }
          resp = yt.videos().list(part="statistics,status,snippet", id=",".join(ids)).execute()
          for item in resp.get("items", []):
              vid = item["id"]
              print(vid, ids.get(vid, "?"),
                    "privacy=" + item["status"]["privacyStatus"],
                    "views=" + item["statistics"].get("viewCount", "?"),
                    "title=" + item["snippet"]["title"][:50])

          # also list the channel's most recent uploads regardless of id guesses
          print("\n--- recent uploads via search ---")
          search = yt.search().list(part="id,snippet", forMine=True, type="video", order="date", maxResults=15).execute()
          for item in search.get("items", []):
              vid = item["id"]["videoId"]
              print(vid, item["snippet"]["publishedAt"], item["snippet"]["title"][:60])
          PYEOF
